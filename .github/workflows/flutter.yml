name: Build Flutter (Windows, Android, iOS)

# Déclenche le workflow sur un push de tag (ex: v1.0.0) ou manuellement
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.41.5'   # Adaptez à la version utilisée dans votre projet (cf. flutter --version)

jobs:
  # ----------------------------------------------------------------
  # BUILD ANDROID (.apk + .aab)
  # ----------------------------------------------------------------
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configuration Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Récupération des dépendances
        run: flutter pub get

      - name: Analyse du code (optionnel)
        run: flutter analyze
        continue-on-error: true

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Build App Bundle (release, pour le Play Store)
        run: flutter build appbundle --release

      - name: Upload artefacts Android
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab

  # ----------------------------------------------------------------
  # BUILD WINDOWS (.exe)
  # ----------------------------------------------------------------
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Activer le support desktop Windows
        run: flutter config --enable-windows-desktop

      - name: Récupération des dépendances
        run: flutter pub get

      - name: Build Windows (release)
        run: flutter build windows --release

      - name: Compression du build Windows
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath windows-build.zip
        shell: pwsh

      - name: Upload artefact Windows
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: windows-build.zip

  # ----------------------------------------------------------------
  # BUILD iOS (.app non signé — pas de compte Apple Developer requis)
  # ----------------------------------------------------------------
  build-ios:
    name: Build iOS
    runs-on: macos-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Récupération des dépendances
        run: flutter pub get

      - name: Installation des pods
        run: |
          cd ios
          pod install
        continue-on-error: true

      - name: Build iOS (release, sans signature)
        run: flutter build ios --release --no-codesign

      - name: Création de l'archive .ipa (non signée)
        run: |
          mkdir Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r app-unsigned.ipa Payload

      - name: Upload artefact iOS
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: app-unsigned.ipa
