name: Flutter CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 📥 Récupère le code
      - name: Checkout repository
        uses: actions/checkout@v4

      # ⚡ Cache des dépendances Flutter pour accélérer les builds
      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ${{ github.workspace }}/.dart_tool
          key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      # 🚀 Installation de Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      # 📦 Installation des dépendances
      - name: Install dependencies
        run: flutter pub get

      # 🔍 Analyse du code
      - name: Analyze project
        run: flutter analyze

      # 🎨 Vérification du formatage (optionnel mais recommandé)
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      # 🧪 Lancement des tests
      - name: Run tests
        run: flutter test

      # 📱 Build APK (optionnel, mais utile)
      - name: Build APK
        run: flutter build apk --release
